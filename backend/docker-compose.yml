services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./HotelReservation.Api
    container_name: hotel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5047:8080"
    environment:
      # Development mode enables the API docs, and the dev-only password reset token.
      # Everything below is a local development default, never use these values elsewhere.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hotel_reservation;Username=postgres;Password=postgres
      Jwt__Key: dev-only-signing-key-change-me-0123456789abcdef
      Seed__Admin__Email: admin@hotel.com
      Seed__Admin__Password: hoteladmin
      # Sample hotels, rooms and users for frontend work. Set to false for an empty system.
      Seed__Demo: "true"
      Cors__AllowedOrigins__0: http://localhost:5500
      Cors__AllowedOrigins__1: http://127.0.0.1:5500

  # Optional MariaDB stack, started with: docker compose --profile mariadb up -d
  # Same version as the school server. Runs next to the PostgreSQL stack; its API is on port 5048.
  mariadb:
    # 10.4.12 predates the MARIADB_* variables, so it is configured with the MYSQL_* ones.
    image: mariadb:10.4.12
    container_name: mariadb
    profiles: [mariadb]
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_520_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_reservation
      # The API connects as this user, which only has rights on hotel_reservation (like a school account).
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # TCP on purpose: during first-time setup the server only listens on its socket, so this stays
      # unhealthy until MariaDB is really ready (the first start takes 20-30 s).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  api-mariadb:
    build: ./HotelReservation.Api
    container_name: hotel-api-mariadb
    profiles: [mariadb]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "5048:8080"
    environment:
      # Same local development defaults as the api service, never use these values elsewhere.
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: MySql
      Database__ServerVersion: 10.4.12-mariadb
      ConnectionStrings__Default: Server=mariadb;Port=3306;Database=hotel_reservation;User=hotel;Password=hotel
      Jwt__Key: dev-only-signing-key-change-me-0123456789abcdef
      Seed__Admin__Email: admin@hotel.com
      Seed__Admin__Password: hoteladmin
      Seed__Demo: "true"
      Cors__AllowedOrigins__0: http://localhost:5500
      Cors__AllowedOrigins__1: http://127.0.0.1:5500

  # Dev test page (./test-client). Mounted, so edits show up on refresh. It calls the API from the browser.
  test-client:
    image: nginx:alpine
    container_name: hotel-test-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5500:80"
    volumes:
      - ./test-client:/usr/share/nginx/html:ro

volumes:
  postgres-data:
  mariadb-data: