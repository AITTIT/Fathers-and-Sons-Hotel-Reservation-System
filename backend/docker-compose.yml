services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./HotelReservation.Api
    container_name: hotel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5047:8080"
    environment:
      # Development mode enables the API docs, and the dev-only password reset token.
      # Everything below is a local development default, never use these values elsewhere.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hotel_reservation;Username=postgres;Password=postgres
      Jwt__Key: dev-only-signing-key-change-me-0123456789abcdef
      Seed__Admin__Email: default-admin@change.me
      Seed__Admin__Password: hoteladmin
      # Sample hotels, rooms, users and bookings for frontend work. Set to false for an empty system.
      Seed__Demo: "true"
      Cors__AllowedOrigins__0: http://localhost:5500
      Cors__AllowedOrigins__1: http://127.0.0.1:5500

  # Dev test page (../test-client). Mounted, so edits show up on refresh. It calls the API from the browser.
  test-client:
    image: nginx:alpine
    container_name: hotel-test-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5500:80"
    volumes:
      - ../test-client:/usr/share/nginx/html:ro

volumes:
  postgres-data: