<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hotel Reservation - Dev Page</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; font-size: 14px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { background: #eee; }
    .null { color: #999; font-style: italic; }
    .error { color: #b00; }
    form { display: grid; gap: 6px; max-width: 320px; margin-bottom: 1rem; }
    .forms { display: flex; gap: 3rem; flex-wrap: wrap; }
    pre { background: #f4f4f4; padding: 8px; max-width: 700px; overflow: auto; }
    #session { background: #eef; border: 1px solid #99c; padding: 8px 12px; margin-bottom: 1rem; display: flex; gap: 12px; align-items: center; }
    #session.in { background: #efe; border-color: #6a6; }
  </style>
</head>
<body>
  <div id="session">
    <span id="who">Not logged in</span>
    <button id="logout" hidden>Logout</button>
  </div>

  <h1>Auth test</h1>
  <div class="forms">
    <form id="login">
      <h2>Login</h2>
      <input name="email" type="email" placeholder="Email" value="customer1@hotel.test" required>
      <input name="password" type="password" placeholder="Password" value="Password123!" required>
      <button>Login</button>
    </form>
    <form id="register">
      <h2>Register</h2>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password (min 8)" required>
      <input name="firstName" placeholder="First name" required>
      <input name="lastName" placeholder="Last name" required>
      <input name="phone" placeholder="Phone (optional)">
      <button>Register</button>
    </form>
  </div>
  <div id="accountForms" hidden>
    <div id="userPicker" hidden>
      <label>Acting on user (admin):
        <select id="userSelect"></select>
      </label>
    </div>
    <div class="forms">
    <form id="profile">
      <h2>Edit profile</h2>
      <input name="userId" type="hidden">
      <input name="email" type="email" placeholder="Email" required>
      <input name="firstName" placeholder="First name" required>
      <input name="lastName" placeholder="Last name" required>
      <input name="phone" placeholder="Phone (optional)">
      <select name="role" title="Admins only">
        <option value="">Role: unchanged</option>
        <option>Customer</option>
        <option>Staff</option>
        <option>Admin</option>
      </select>
      <button>Save</button>
    </form>
    <form id="changePassword">
      <h2>Change password</h2>
      <input name="userId" type="hidden">
      <input name="currentPassword" type="password" placeholder="Current password (not needed for admin on others)">
      <input name="newPassword" type="password" placeholder="New password (min 8)" required>
      <button>Change password</button>
    </form>
    </div>
  </div>
  <div class="forms">
    <form id="forgot">
      <h2>Forgot password</h2>
      <input name="email" type="email" placeholder="Email" required>
      <button>Request reset token</button>
    </form>
    <form id="reset">
      <h2>Reset password</h2>
      <input name="email" type="email" placeholder="Email" required>
      <input name="token" placeholder="Reset token" required>
      <input name="newPassword" type="password" placeholder="New password (min 8)" required>
      <button>Reset password</button>
    </form>
  </div>
  <h3>Response</h3>
  <pre id="result">-</pre>

  <h1>Database tables</h1>
  <button id="refresh">Refresh</button>
  <div id="tables"></div>

  <script>
    const TOKEN_KEY = 'authToken';
    // This page is served from a different origin than the API, so every call needs the base URL.
    // Override with ?api=http://host:port
    const API = (new URLSearchParams(location.search).get('api') || 'http://localhost:5047').replace(/\/$/, '');

    async function load() {
      const container = document.getElementById('tables');
      container.textContent = 'Loading...';
      try {
        const token = localStorage.getItem(TOKEN_KEY);
        const res = await fetch(API + '/api/dev/tables', token ? { headers: { Authorization: 'Bearer ' + token } } : undefined);
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const tables = await res.json();
        updateUserPicker(tables);
        container.replaceChildren();
        for (const t of tables) {
          const h = document.createElement('h2');
          h.textContent = `${t.name} (${t.rows.length} rows)`;
          const table = document.createElement('table');
          const head = table.createTHead().insertRow();
          for (const c of t.columns) head.appendChild(Object.assign(document.createElement('th'), { textContent: c }));
          const body = table.createTBody();
          for (const r of t.rows) {
            const tr = body.insertRow();
            for (const v of r) {
              const td = tr.insertCell();
              if (v === null) { td.textContent = 'NULL'; td.className = 'null'; }
              else { td.textContent = v; td.title = v; }
            }
          }
          container.append(h, table);
        }
      } catch (e) {
        const p = document.createElement('p');
        p.className = 'error';
        p.textContent = 'Failed to load: ' + e.message;
        container.replaceChildren(p);
      }
    }

    let currentUser = null;
    let usersById = new Map();

    // Admins get every user from the tables response; others only ever act on themselves.
    function updateUserPicker(tables) {
      const picker = document.getElementById('userPicker');
      const select = document.getElementById('userSelect');
      const usersTable = tables.find(t => t.name === 'Users');
      picker.hidden = !(currentUser?.role === 'Admin' && usersTable);
      usersById = new Map();
      if (picker.hidden) return;

      const col = name => usersTable.columns.indexOf(name);
      const previous = select.value;
      select.replaceChildren();
      for (const r of usersTable.rows) {
        const u = {
          id: r[col('Id')], email: r[col('Email')], firstName: r[col('FirstName')],
          lastName: r[col('LastName')], phone: r[col('Phone')], role: r[col('Role')]
        };
        usersById.set(u.id, u);
        const option = document.createElement('option');
        option.value = u.id;
        option.textContent = `${u.firstName} ${u.lastName} <${u.email}> [${u.role}]` + (u.id === currentUser.id ? ' (you)' : '');
        select.append(option);
      }
      select.value = usersById.has(Number(previous)) ? previous : String(currentUser.id);
    }

    document.getElementById('userSelect').onchange = e => {
      const user = usersById.get(Number(e.target.value));
      if (user) fillAccountForms(user);
    };

    function fillAccountForms(user) {
      const profile = document.getElementById('profile');
      for (const [name, value] of Object.entries({
        userId: user.id, email: user.email, firstName: user.firstName, lastName: user.lastName, phone: user.phone ?? '', role: ''
      })) profile.elements[name].value = value;
      document.getElementById('changePassword').elements.userId.value = user.id;
    }

    function showUser(user) {
      currentUser = user;
      document.getElementById('accountForms').hidden = !user;
      // Reset the picker so a new login starts on its own account.
      document.getElementById('userSelect').replaceChildren();
      if (user) fillAccountForms(user);
      const who = document.getElementById('who');
      document.getElementById('session').classList.toggle('in', !!user);
      document.getElementById('logout').hidden = !user;
      who.textContent = user
        ? `Logged in as ${user.firstName} ${user.lastName} <${user.email}> [${user.role}] (id ${user.id})`
        : 'Not logged in';
    }

    async function restoreSession() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return showUser(null);
      const res = await fetch(API + '/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
      if (res.ok) return showUser(await res.json());
      localStorage.removeItem(TOKEN_KEY);
      showUser(null);
    }

    document.getElementById('logout').onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      showUser(null);
      load();
    };

    async function submitForm(e, url, onSuccess, { method = 'POST', auth = false } = {}) {
      e.preventDefault();
      // Empty fields are left out so optional values arrive as null.
      const body = Object.fromEntries([...new FormData(e.target)].filter(([, v]) => v !== ''));
      const out = document.getElementById('result');
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem(TOKEN_KEY);
      if (auth && token) headers.Authorization = 'Bearer ' + token;
      try {
        const res = await fetch(API + url, { method, headers, body: JSON.stringify(body) });
        const text = await res.text();
        let data = text;
        let parsed = null;
        try { parsed = JSON.parse(text); data = JSON.stringify(parsed, null, 2); } catch {}
        out.textContent = `${res.status} ${res.statusText}\n${data}`;
        if (res.ok && onSuccess) onSuccess(parsed);
      } catch (err) {
        out.textContent = 'Request failed: ' + err.message;
      }
    }
    document.getElementById('login').onsubmit = e => submitForm(e, '/api/auth/login', r => {
      localStorage.setItem(TOKEN_KEY, r.token);
      showUser(r.user);
      load();
    });
    document.getElementById('register').onsubmit = e => submitForm(e, '/api/auth/register', () => load());

    document.getElementById('profile').onsubmit = e => {
      const id = e.target.elements.userId.value;
      return submitForm(e, `/api/users/${id}`, updated => {
        // Editing yourself refreshes the "logged in as" bar.
        if (currentUser && updated.id === currentUser.id) showUser(updated);
        load();
      }, { method: 'PUT', auth: true });
    };
    document.getElementById('changePassword').onsubmit = e =>
      submitForm(e, `/api/users/${e.target.elements.userId.value}/change-password`, null, { auth: true });

    document.getElementById('forgot').onsubmit = e => submitForm(e, '/api/auth/forgot-password', r => {
      // Dev only: the API returns the token because there is no email delivery yet.
      if (r.devToken) {
        const reset = document.getElementById('reset');
        reset.elements.email.value = e.target.elements.email.value;
        reset.elements.token.value = r.devToken;
      }
    });
    document.getElementById('reset').onsubmit = e => submitForm(e, '/api/auth/reset-password');
    document.getElementById('refresh').onclick = load;
    restoreSession().then(load);
  </script>
</body>
</html>
